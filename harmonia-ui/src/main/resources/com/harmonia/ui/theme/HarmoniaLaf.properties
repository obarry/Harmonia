# Harmonia theme, loaded by FlatLaf on top of FlatDarkLaf.properties
# Palette: see HarmoniaColors.java and docs/DESIGN_ROADMAP.md

#---- Base variables ----
@background = #0e0f11
@foreground = #d8dade
@accentColor = #2ec4b6
@componentBackground = #18191c
@buttonBackground = #2a2c31
@menuBackground = #141518
@selectionBackground = #1f3b38
@selectionForeground = #ffffff
@selectionInactiveBackground = #23262a
@disabledForeground = #5d616a

#---- Shapes ----
Component.arc = 8
Button.arc = 8
TextComponent.arc = 6
CheckBox.arc = 4
ProgressBar.arc = 6
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #2c2f35
Component.focusedBorderColor = #2ec4b6
Component.focusColor = #2ec4b680

#---- Buttons ----
Button.borderColor = #3a3d44
Button.hoverBackground = #33363d
Button.pressedBackground = #3a3d44
Button.default.background = #2ec4b6
Button.default.foreground = #08201e
ToggleButton.selectedBackground = #1f3b38
ToggleButton.selectedForeground = #bff7ef
ToggleButton.tab.underlineColor = #2ec4b6
ToggleButton.tab.underlineHeight = 2
ToggleButton.tab.selectedBackground = #202227
ToggleButton.tab.hoverBackground = #1b1c20

#---- Panels, lists, scroll bars ----
Panel.background = #0e0f11
List.background = #18191c
List.selectionBackground = #1d3532
ScrollPane.background = #18191c
Viewport.background = #18191c
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #18191c
ScrollBar.thumb = #33363d
ScrollBar.showButtons = false
Separator.foreground = #2a2c31
SplitPane.background = #0e0f11
SplitPaneDivider.draggingColor = #2ec4b6

#---- Text ----
TextField.background = #0f1012
TextField.placeholderForeground = #5d616a
TextArea.background = #0b0c0e
ToolTip.background = #202227
ToolTip.foreground = #d8dade

#---- Menus and title bar ----
TitlePane.unifiedBackground = true
TitlePane.background = #141518
MenuBar.background = #141518
PopupMenu.background = #18191c
